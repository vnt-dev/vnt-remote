[package]
name = "vnt-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vnt-link = { path = "../vnt-link" }
uuid = { version = "1", features = ["v4"] }
hostname = { workspace = true }
bytes = { workspace = true }
vnt-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
vnt-proto = { workspace = true }
vnt-net = { workspace = true }
vnt-capture = { workspace = true }
vnt-codec = { workspace = true }
vnt-input = { workspace = true }
vnt-clip = { workspace = true }
vnt-audio = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"


[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_HiDpi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Security_Authentication_Identity"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
vnt-macos = { path = "../vnt-macos" }
serde_json = { workspace = true }

[package]
name = "vnt-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vnt-remote screen capture wrapper around screencap (DXGI/WGC)"

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
screencap = { workspace = true }

[[bin]]
name = "capture-bench"
path = "src/bin/capture_bench.rs"

[[bin]]
name = "capture-motion-bench"
path = "src/bin/capture_motion_bench.rs"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
vnt-macos = { path = "../vnt-macos" }
serde_json = { workspace = true }

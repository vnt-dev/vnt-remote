[package]
name = "vnt-core"
version = "2.0.11"
edition = "2024"
license = "Apache-2.0"

[features]
internal-bench = []

[dependencies]

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"

rustp2p-core = { git = "https://github.com/rustp2p/rustp2p", rev = "7d3ac1d9416e578abd57455fba1b0d461d5328e8" }

anyhow = "1"
parking_lot = "0.12"
arc-swap = "1.7"

quinn = { version = "0.11", default-features = false, features = ["rustls", "runtime-tokio"] }

tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "stream"] }
hex = "0.4"
sha2 = "0.11"
rustls-native-certs = "0.8.2"
log = "0.4"
bytes = "1.11.0"
rand = "0.10"
time = { version = "0.3", features = ["macros", "formatting", "local-offset"] }
ring = "0.17.14"
subtle = "2.6"
zerocopy = { version = "0.8.31", features = ["derive"] }
socket2 = { version = "0.6.1", features = ["all"] }

prost = "0.14"
tokio-tungstenite = "0.30"
uuid = { version = "1.18.1", features = ["v4"] }
ipnet = { version = "2.11", features = ["serde"] }
getifaddrs = "0.6.0"
dns-parser = "0.8"

lz4_flex = "0.14"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
base64 = "0.22"
rcgen = "0.14.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
machine-uid = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
# reqwest's platform verifier needs an Android Context and companion JVM classes.
# vnt-core is also embedded by vnt-jni, so use bundled WebPKI roots for its
# dynamic server-list HTTPS requests instead of relying on host initialization.
webpki-roots = "1"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "route_lookup"
harness = false
required-features = ["internal-bench"]

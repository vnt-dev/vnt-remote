[package]
name = "vnt-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "vnt-remote LAN remote desktop (Tauri app)"

[lib]
name = "vnt_remote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vnt-client = { path = "../crates/vnt-client" }
vnt-host = { path = "../crates/vnt-host" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }
vnt-proto = { workspace = true }
vnt-net = { workspace = true }
vnt-capture = { workspace = true }
vnt-codec = { workspace = true }
vnt-input = { workspace = true }
vnt-clip = { workspace = true }
vnt-audio = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

[features]
default = []
installed = []
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
env_logger = "0.11"
socket2 = "0.6"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
vnt-macos = { path = "../crates/vnt-macos" }
